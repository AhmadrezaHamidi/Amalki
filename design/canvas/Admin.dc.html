<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<title>آشیانه — داشبورد مدیر</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;700;800&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#1E3A5F;text-decoration:none}a:hover{color:#142C4A}
</style>
</helmet>
<div dir="rtl" style="font-family: Vazirmatn, system-ui, sans-serif; background: #FAF7F2; color: #1C1917; line-height: 1.7; min-height: 100vh; display: flex; flex-wrap: wrap">
  <aside aria-label="منوی پنل" style="flex: 1 1 240px; max-width: 260px; background: #14213A; color: #CBD3DF; padding: 24px 16px; display: flex; flex-direction: column; gap: 6px">
    <strong style="color: #FFFFFF; font-size: 20px; padding: 0 12px 16px">آشیانه · پنل</strong>
    <a href="#" aria-current="page" style="min-height: 44px; padding: 0 12px; border-radius: 10px; background: #1E3A5F; color: #FFFFFF; display: flex; align-items: center; font-weight: 700">آگهی‌ها</a>
    <a href="#" style="min-height: 44px; padding: 0 12px; border-radius: 10px; color: #CBD3DF; display: flex; align-items: center; justify-content: space-between">درخواست‌های تماس <span style="background: #B45309; color: #FFFFFF; border-radius: 999px; font-size: 12px; padding: 0 8px">۳ جدید</span></a>
    <a href="#" style="min-height: 44px; padding: 0 12px; border-radius: 10px; color: #CBD3DF; display: flex; align-items: center">مشاهدهٔ سایت</a>
    <a href="#" style="min-height: 44px; padding: 0 12px; border-radius: 10px; color: #CBD3DF; display: flex; align-items: center">خروج</a>
  </aside>
  <main style="flex: 999 1 640px; min-width: 0; padding: 28px 32px; display: flex; flex-direction: column; gap: 24px">
    <div style="display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap">
      <h1 style="margin: 0; font-size: 28px; font-weight: 800">آگهی‌ها</h1>
      <a href="#" style="min-height: 44px; padding: 0 20px; border-radius: 12px; background: #C2410C; color: #FFFFFF; font-weight: 700; display: inline-flex; align-items: center">+ آگهی جدید</a>
    </div>
    <div style="display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 16px">
      <sc-for list="{{stats}}" as="s" hint-placeholder-count="4">
        <div style="background: #FFFFFF; border: 1px solid #E7DFD3; border-radius: 18px; padding: 18px; display: flex; flex-direction: column">
          <span style="color: #5F5750; font-size: 14px">{{s.k}}</span><strong style="font-size: 28px">{{s.v}}</strong>
        </div>
      </sc-for>
    </div>
    <div style="background: #FFFFFF; border: 1px solid #E7DFD3; border-radius: 18px; overflow-x: auto">
      <table style="width: 100%; border-collapse: collapse; font-size: 15px">
        <thead><tr style="background: #FAF7F2; color: #5F5750; text-align: start">
          <th style="padding: 12px 16px; text-align: start; font-weight: 500">آگهی</th><th style="padding: 12px 16px; text-align: start; font-weight: 500">معامله</th><th style="padding: 12px 16px; text-align: start; font-weight: 500">قیمت</th><th style="padding: 12px 16px; text-align: start; font-weight: 500">وضعیت</th><th style="padding: 12px 16px; text-align: start; font-weight: 500">کانال‌ها</th><th style="padding: 12px 16px; text-align: start; font-weight: 500">عملیات</th>
        </tr></thead>
        <tbody>
          <sc-for list="{{rows}}" as="r" hint-placeholder-count="5">
            <tr style="border-top: 1px solid #F2EDE5">
              <td style="padding: 12px 16px"><div style="display: flex; gap: 12px; align-items: center"><span style="width: 56px; height: 42px; border-radius: 8px; background: #ECE4D8; flex: none"></span><span><strong style="display: block">{{r.t}}</strong><span style="color: #5F5750; font-size: 13px">{{r.loc}}</span></span></div></td>
              <td style="padding: 12px 16px">{{r.deal}}</td>
              <td style="padding: 12px 16px; white-space: nowrap">{{r.price}}</td>
              <td style="padding: 12px 16px"><span style="{{r.statusStyle}}">{{r.status}}</span></td>
              <td style="padding: 12px 16px; font-size: 13px; color: #5F5750; white-space: nowrap">{{r.ch}}</td>
              <td style="padding: 12px 16px; white-space: nowrap"><a href="#" style="font-weight: 700">ویرایش</a> · <a href="#" style="font-weight: 700">{{r.action}}</a></td>
            </tr>
          </sc-for>
        </tbody>
      </table>
    </div>
  </main>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":1300}}'>
class Component extends DCLogic {
  renderVals() {
    const pill = (bg, fg) => 'background: ' + bg + '; color: ' + fg + '; border-radius: 999px; padding: 2px 12px; font-size: 13px; font-weight: 700; white-space: nowrap';
    const pub = pill('#E9EEF5', '#142C4A'), draft = pill('#F1F3F3', '#3D4A49'), closed = pill('#FDECEC', '#9B1C1C');
    return {
      stats: [{ k: 'منتشرشده', v: '۱۸' }, { k: 'پیش‌نویس', v: '۴' }, { k: 'درخواست تماس جدید', v: '۳' }, { k: 'خطای کانال', v: '۰' }],
      rows: [
        { t: 'آپارتمان ۱۲۰ متری نوساز', loc: 'سعادت‌آباد، تهران', deal: 'فروش', price: '۱۲٫۵ میلیارد', status: 'منتشرشده', statusStyle: pub, ch: 'تلگرام ✓  بله ✓', action: 'لغو انتشار' },
        { t: 'سوئیت مبله نزدیک مترو', loc: 'ونک، تهران', deal: 'اجاره', price: '۴۰۰م + ۸م', status: 'منتشرشده', statusStyle: pub, ch: 'تلگرام ✓  بله ✓', action: 'لغو انتشار' },
        { t: 'ویلای باغ ۵۰۰ متری', loc: 'مشکین‌دشت، کرج', deal: 'فروش', price: '۲۸ میلیارد', status: 'پیش‌نویس', statusStyle: draft, ch: '—', action: 'انتشار' },
        { t: 'مغازهٔ دوبله خیابان اصلی', loc: 'معالی‌آباد، شیراز', deal: 'اجاره', price: '۶۰۰م + ۲۵م', status: 'منتشرشده', statusStyle: pub, ch: 'تلگرام ✓  بله ✓', action: 'لغو انتشار' },
        { t: 'دفتر کار ۹۰ متری', loc: 'ونک، تهران', deal: 'فروش', price: '۹ میلیارد', status: 'بسته‌شده', statusStyle: closed, ch: '—', action: 'انتشار' }
      ]
    };
  }
}
</script>
</body>
</html>
