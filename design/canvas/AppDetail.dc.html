<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<title>اپ آشیانه — جزئیات ملک</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;700;800&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#0F766E;text-decoration:none}a:hover{color:#0B4F4A}
</style>
</helmet>
<div dir="rtl" style="width: 390px; height: 844px; box-sizing: border-box; font-family: Vazirmatn, system-ui, sans-serif; background: #FFFFFF; color: #10201F; line-height: 1.7; display: flex; flex-direction: column; overflow: hidden">
  <div style="position: relative; height: 300px; background: #DCEBE8; display: grid; place-items: center; color: #3F5F5B; flex: none">[عکس ملک]
    <a href="AppHome.dc.html" aria-label="بازگشت" style="position: absolute; top: 16px; inset-inline-start: 16px; width: 44px; height: 44px; border-radius: 999px; background: #FFFFFF; display: grid; place-items: center; color: #10201F">
      <svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="m9 18 6-6-6-6"></path></svg></a>
    <button type="button" aria-label="نشان کردن" onClick="{{toggle}}" style="position: absolute; top: 16px; inset-inline-end: 16px; width: 44px; height: 44px; border-radius: 999px; border: 0; background: #FFFFFF; display: grid; place-items: center; cursor: pointer">
      <svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="{{fill}}" stroke="{{stroke}}" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 14c1.5-1.5 3-3.2 3-5.5A5.5 5.5 0 0 0 12 5.5 5.5 5.5 0 0 0 2 8.5c0 2.3 1.5 4 3 5.5l7 7Z"></path></svg></button>
    <span style="position: absolute; bottom: 14px; inset-inline-end: 16px; background: rgba(16,32,31,.72); color: #FFFFFF; font-size: 12px; padding: 0 10px; border-radius: 999px">۱ / ۸</span>
  </div>
  <div style="flex: 1; overflow: hidden; padding: 18px 16px; display: flex; flex-direction: column; gap: 14px; border-radius: 24px 24px 0 0; margin-top: -20px; background: #FFFFFF; position: relative">
    <div style="display: flex; gap: 6px"><span style="background: #0F766E; color: #FFFFFF; font-size: 12px; font-weight: 700; padding: 2px 10px; border-radius: 999px">فروش</span><span style="background: #E6F4F1; color: #0B4F4A; font-size: 12px; font-weight: 700; padding: 2px 10px; border-radius: 999px">آپارتمان</span></div>
    <div><h1 style="margin: 0; font-size: 21px; font-weight: 800">آپارتمان ۱۲۰ متری نوساز</h1><span style="color: #4B5B5A; font-size: 14px">سعادت‌آباد، تهران</span></div>
    <div style="display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 8px">
      <sc-for list="{{facts}}" as="f" hint-placeholder-count="4">
        <div style="background: #F5F8F7; border-radius: 14px; padding: 10px; text-align: center"><strong style="display: block; font-size: 16px">{{f.v}}</strong><span style="font-size: 12px; color: #4B5B5A">{{f.k}}</span></div>
      </sc-for>
    </div>
    <p style="margin: 0; color: #2E403E; font-size: 15px">آپارتمان نوساز با نورگیر عالی از جنوب، آشپزخانهٔ اپن و کابینت هایگلاس. ساختمان آسانسور، لابی و انباری دارد.</p>
  </div>
  <div style="flex: none; padding: 12px 16px 20px; border-top: 1px solid #DDE7E5; display: flex; gap: 12px; align-items: center; background: #FFFFFF">
    <div style="flex: 1"><span style="font-size: 12px; color: #4B5B5A">قیمت</span><strong style="display: block; color: #0F766E; font-size: 19px; font-weight: 800; line-height: 1.3">۱۲٫۵ میلیارد</strong></div>
    <a href="#" aria-label="تماس تلفنی" style="width: 52px; height: 52px; border-radius: 16px; border: 1px solid #0F766E; display: grid; place-items: center; color: #0F766E">
      <svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 16.9v3a2 2 0 0 1-2.2 2 19.8 19.8 0 0 1-8.6-3.1 19.5 19.5 0 0 1-6-6A19.8 19.8 0 0 1 2.1 4.2 2 2 0 0 1 4.1 2h3a2 2 0 0 1 2 1.7c.1 1 .4 1.9.7 2.8a2 2 0 0 1-.5 2.1L8 9.9a16 16 0 0 0 6 6l1.3-1.3a2 2 0 0 1 2.1-.4c.9.3 1.8.6 2.8.7a2 2 0 0 1 1.7 2Z"></path></svg></a>
    <a href="#" style="min-height: 52px; padding: 0 22px; border-radius: 16px; background: #0F766E; color: #FFFFFF; font-weight: 700; display: inline-flex; align-items: center">درخواست بازدید</a>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(p) { super(p); this.state = { saved: false }; }
  renderVals() {
    const s = this.state.saved;
    return {
      toggle: () => this.setState({ saved: !s }),
      fill: s ? '#B42318' : 'none', stroke: s ? '#B42318' : '#10201F',
      facts: [{ k: 'متر', v: '۱۲۰' }, { k: 'خواب', v: '۳' }, { k: 'طبقه', v: '۴' }, { k: 'پارکینگ', v: '۱' }]
    };
  }
}
</script>
</body>
</html>
