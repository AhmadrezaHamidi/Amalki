<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<title>آشیانه — لیست آگهی‌ها</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;700;800&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#1E3A5F;text-decoration:none}a:hover{color:#142C4A}
</style>
</helmet>
<div dir="rtl" style="font-family: Vazirmatn, system-ui, sans-serif; background: #FAF7F2; color: #1C1917; line-height: 1.8; min-height: 100vh">
  <header style="background: #FFFFFF; border-bottom: 1px solid #E7DFD3">
    <div style="max-width: 1200px; margin: 0 auto; padding: 14px 24px; display: flex; align-items: center; gap: 28px; flex-wrap: wrap">
      <a href="Main.dc.html" style="display: flex; align-items: center; gap: 10px; color: #1E3A5F; font-weight: 800; font-size: 22px">
        <span style="width: 40px; height: 40px; border-radius: 12px; background: #1E3A5F; display: grid; place-items: center"><svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 10.5 12 3l9 7.5"></path><path d="M5 9.5V21h14V9.5"></path><path d="M10 21v-6h4v6"></path></svg></span>آشیانه</a>
      <nav aria-label="منوی اصلی" style="display: flex; gap: 24px; font-weight: 500; flex: 1 1 auto; flex-wrap: wrap">
        <a href="#" style="color: #1E3A5F; font-weight: 700">خرید</a><a href="#" style="color: #1C1917">اجاره و رهن</a><a href="#" style="color: #1C1917">همهٔ آگهی‌ها</a>
      </nav>
      <a href="#" style="min-height: 44px; padding: 0 20px; border-radius: 12px; background: #C2410C; color: #FFFFFF; font-weight: 700; display: inline-flex; align-items: center">تماس با مشاور</a>
    </div>
  </header>

  <div style="max-width: 1200px; margin: 0 auto; padding: 24px 24px 64px">
    <nav aria-label="مسیر" style="font-size: 14px; color: #5F5750"><a href="Main.dc.html">خانه</a> / خرید ملک</nav>
    <div style="display: flex; justify-content: space-between; align-items: end; gap: 16px; flex-wrap: wrap; margin: 6px 0 20px">
      <div>
        <h1 style="margin: 0; font-size: 32px; font-weight: 800">خرید ملک در تهران</h1>
        <p style="margin: 0; color: #5F5750">[تعداد] آگهی پیدا شد</p>
      </div>
      <label style="display: flex; align-items: center; gap: 10px; font-size: 14px; color: #5F5750">مرتب‌سازی
        <select style="font: inherit; min-height: 44px; border-radius: 12px; border: 1px solid #E7DFD3; background: #FFFFFF; color: #1C1917; padding: 0 12px"><option>جدیدترین</option><option>ارزان‌ترین</option><option>گران‌ترین</option><option>بزرگ‌ترین متراژ</option></select>
      </label>
    </div>

    <div style="display: flex; gap: 24px; flex-wrap: wrap; align-items: flex-start">
      <aside aria-label="فیلترها" style="flex: 1 1 260px; max-width: 300px; background: #FFFFFF; border: 1px solid #E7DFD3; border-radius: 20px; padding: 20px; display: flex; flex-direction: column; gap: 16px">
        <strong style="font-size: 17px">فیلترها</strong>
        <div style="display: flex; gap: 4px; padding: 4px; background: #FAF7F2; border-radius: 12px">
          <button type="button" style="flex: 1; min-height: 40px; border: 0; border-radius: 9px; background: #FFFFFF; color: #1E3A5F; font: inherit; font-weight: 700; box-shadow: 0 1px 3px rgba(28,25,23,.12)">خرید</button>
          <button type="button" style="flex: 1; min-height: 40px; border: 0; border-radius: 9px; background: transparent; color: #5F5750; font: inherit">اجاره</button>
        </div>
        <label style="display: flex; flex-direction: column; gap: 4px; font-size: 14px; font-weight: 500">شهر
          <input value="تهران" style="font: inherit; min-height: 44px; border-radius: 12px; border: 1px solid #E7DFD3; padding: 0 12px; background: #FAF7F2"></label>
        <label style="display: flex; flex-direction: column; gap: 4px; font-size: 14px; font-weight: 500">نوع ملک
          <select style="font: inherit; min-height: 44px; border-radius: 12px; border: 1px solid #E7DFD3; padding: 0 12px; background: #FAF7F2"><option>همهٔ انواع</option><option>آپارتمان</option></select></label>
        <fieldset style="border: 0; padding: 0; margin: 0; display: flex; flex-direction: column; gap: 6px">
          <legend style="font-size: 14px; font-weight: 500; margin-bottom: 6px">تعداد خواب</legend>
          <div style="display: flex; gap: 6px">
            <sc-for list="{{beds}}" as="b" hint-placeholder-count="5">
              <button type="button" onClick="{{b.pick}}" style="{{b.style}}">{{b.label}}</button>
            </sc-for>
          </div>
        </fieldset>
        <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px">
          <label style="display: flex; flex-direction: column; gap: 4px; font-size: 14px; font-weight: 500">حداقل متراژ
            <input inputmode="numeric" placeholder="مثلاً ۸۰" style="font: inherit; min-height: 44px; border-radius: 12px; border: 1px solid #E7DFD3; padding: 0 12px; background: #FAF7F2; min-width: 0"></label>
          <label style="display: flex; flex-direction: column; gap: 4px; font-size: 14px; font-weight: 500">سقف قیمت
            <input inputmode="numeric" placeholder="تومان" style="font: inherit; min-height: 44px; border-radius: 12px; border: 1px solid #E7DFD3; padding: 0 12px; background: #FAF7F2; min-width: 0"></label>
        </div>
        <button type="button" style="min-height: 48px; border: 0; border-radius: 12px; background: #C2410C; color: #FFFFFF; font: inherit; font-weight: 700">اعمال فیلتر</button>
        <a href="#" style="text-align: center; font-size: 14px">پاک کردن فیلترها</a>
      </aside>

      <div style="flex: 999 1 560px; min-width: 0; display: flex; flex-direction: column; gap: 16px">
        <div style="display: flex; gap: 8px; flex-wrap: wrap">
          <span style="display: inline-flex; gap: 6px; align-items: center; background: #E9EEF5; color: #142C4A; border-radius: 999px; padding: 4px 6px 4px 14px; font-size: 14px; font-weight: 500">خرید <button type="button" aria-label="حذف فیلتر خرید" style="width: 24px; height: 24px; border: 0; border-radius: 999px; background: #FFFFFF; color: #142C4A; cursor: pointer">×</button></span>
          <span style="display: inline-flex; gap: 6px; align-items: center; background: #E9EEF5; color: #142C4A; border-radius: 999px; padding: 4px 6px 4px 14px; font-size: 14px; font-weight: 500">تهران <button type="button" aria-label="حذف فیلتر شهر" style="width: 24px; height: 24px; border: 0; border-radius: 999px; background: #FFFFFF; color: #142C4A; cursor: pointer">×</button></span>
        </div>
        <div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 20px">
          <sc-for list="{{items}}" as="p" hint-placeholder-count="6">
            <a href="Detail.dc.html" style="background: #FFFFFF; border: 1px solid #E7DFD3; border-radius: 20px; overflow: hidden; display: flex; flex-direction: column; color: #1C1917">
              <div style="position: relative; height: 180px; background: #ECE4D8; display: grid; place-items: center; color: #6B5D4B; font-size: 13px">[عکس ملک]
                <span style="position: absolute; top: 12px; inset-inline-start: 12px; background: #1E3A5F; color: #FFFFFF; font-size: 13px; font-weight: 700; padding: 2px 12px; border-radius: 999px">فروش</span>
                <span style="position: absolute; bottom: 12px; inset-inline-end: 12px; background: rgba(28,25,23,.72); color: #FFFFFF; font-size: 12px; padding: 0 10px; border-radius: 999px">{{p.photos}} عکس</span>
              </div>
              <div style="padding: 16px; display: flex; flex-direction: column; gap: 6px">
                <span style="font-size: 13px; color: #5F5750">{{p.loc}}</span>
                <h3 style="margin: 0; font-size: 17px">{{p.title}}</h3>
                <div style="display: flex; gap: 14px; font-size: 14px; color: #5F5750; padding-bottom: 10px; border-bottom: 1px solid #F2EDE5"><span>{{p.area}} متر</span><span>{{p.beds}} خواب</span><span>{{p.age}}</span></div>
                <span style="color: #1E3A5F; font-weight: 800; font-size: 18px">{{p.price}} <span style="font-weight: 400; font-size: 13px; color: #5F5750">تومان</span></span>
              </div>
            </a>
          </sc-for>
        </div>
        <nav aria-label="صفحه‌بندی" style="display: flex; gap: 8px; justify-content: center; margin-top: 16px">
          <a href="#" aria-current="page" style="min-width: 44px; min-height: 44px; display: grid; place-items: center; border-radius: 12px; background: #1E3A5F; color: #FFFFFF; font-weight: 700">۱</a>
          <a href="#" style="min-width: 44px; min-height: 44px; display: grid; place-items: center; border-radius: 12px; background: #FFFFFF; border: 1px solid #E7DFD3; color: #1C1917">۲</a>
          <a href="#" style="min-width: 44px; min-height: 44px; display: grid; place-items: center; border-radius: 12px; background: #FFFFFF; border: 1px solid #E7DFD3; color: #1C1917">۳</a>
          <a href="#" style="min-height: 44px; padding: 0 16px; display: grid; place-items: center; border-radius: 12px; background: #FFFFFF; border: 1px solid #E7DFD3; color: #1C1917">بعدی</a>
        </nav>
      </div>
    </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":1900}}'>
class Component extends DCLogic {
  constructor(p) { super(p); this.state = { bed: 0 }; }
  renderVals() {
    const labels = ['همه', '۱+', '۲+', '۳+', '۴+'];
    const beds = labels.map((label, i) => ({
      label,
      pick: () => this.setState({ bed: i }),
      style: 'flex: 1; min-height: 44px; border-radius: 10px; font: inherit; font-size: 14px; cursor: pointer; ' + (this.state.bed === i ? 'background: #1E3A5F; color: #FFFFFF; border: 1px solid #1E3A5F; font-weight: 700' : 'background: #FFFFFF; color: #1C1917; border: 1px solid #E7DFD3')
    }));
    const t = [
      ['آپارتمان ۱۲۰ متری نوساز', 'سعادت‌آباد', '۱۲۰', '۳', 'نوساز', '۱۲٫۵ میلیارد', '۸'],
      ['آپارتمان ۹۵ متری فول امکانات', 'پونک', '۹۵', '۲', '۵ سال', '۷٫۸ میلیارد', '۶'],
      ['پنت‌هاوس ۲۱۰ متری با تراس', 'زعفرانیه', '۲۱۰', '۴', 'نوساز', '۴۲ میلیارد', '۱۲'],
      ['آپارتمان ۷۲ متری نورگیر', 'تهرانپارس', '۷۲', '۲', '۸ سال', '۴٫۹ میلیارد', '۵'],
      ['آپارتمان ۱۴۰ متری دوبلکس', 'شهرک غرب', '۱۴۰', '۳', '۲ سال', '۱۸ میلیارد', '۹'],
      ['آپارتمان ۶۵ متری نزدیک مترو', 'صادقیه', '۶۵', '۱', '۱۰ سال', '۳٫۹ میلیارد', '۴']
    ];
    return { beds, items: t.map(([title, d, area, beds, age, price, photos]) => ({ title, loc: d + '، تهران', area, beds, age, price, photos })) };
  }
}
</script>
</body>
</html>
