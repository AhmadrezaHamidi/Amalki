<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<title>اپ آشیانه — خانه</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;700;800&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#0F766E;text-decoration:none}a:hover{color:#0B4F4A}
</style>
</helmet>
<div dir="rtl" style="width: 390px; height: 844px; box-sizing: border-box; font-family: Vazirmatn, system-ui, sans-serif; background: #F5F8F7; color: #10201F; line-height: 1.7; display: flex; flex-direction: column; overflow: hidden">
  <div style="flex: 1; overflow: hidden; padding: 20px 16px 0; display: flex; flex-direction: column; gap: 18px">
    <div style="display: flex; justify-content: space-between; align-items: center">
      <div><span style="font-size: 13px; color: #4B5B5A">سلام</span><strong style="display: block; font-size: 20px">خانهٔ بعدی‌ات کجاست؟</strong></div>
      <button type="button" aria-label="اعلان‌ها" style="width: 44px; height: 44px; border-radius: 14px; border: 1px solid #DDE7E5; background: #FFFFFF; display: grid; place-items: center">
        <svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#10201F" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 8a6 6 0 0 1 12 0c0 7 3 9 3 9H3s3-2 3-9"></path><path d="M10.3 21a1.9 1.9 0 0 0 3.4 0"></path></svg></button>
    </div>
    <label style="display: flex; align-items: center; gap: 10px; min-height: 52px; padding: 0 14px; border-radius: 16px; background: #FFFFFF; border: 1px solid #DDE7E5">
      <svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#4B5B5A" stroke-width="2.2" stroke-linecap="round"><circle cx="11" cy="11" r="7"></circle><path d="m20 20-3.5-3.5"></path></svg>
      <input aria-label="جست‌وجو" placeholder="شهر، محله یا نوع ملک" style="flex: 1; border: 0; font: inherit; font-size: 15px; background: transparent; outline: none; min-width: 0">
    </label>
    <div style="display: flex; gap: 8px">
      <sc-for list="{{chips}}" as="c" hint-placeholder-count="4">
        <button type="button" onClick="{{c.pick}}" style="{{c.style}}">{{c.label}}</button>
      </sc-for>
    </div>
    <div style="display: flex; justify-content: space-between; align-items: center"><strong style="font-size: 17px">تازه‌ترین‌ها</strong><a href="#" style="font-size: 14px; font-weight: 700">همه</a></div>
    <a href="AppDetail.dc.html" style="background: #FFFFFF; border: 1px solid #DDE7E5; border-radius: 20px; overflow: hidden; color: #10201F">
      <div style="position: relative; height: 180px; background: #DCEBE8; display: grid; place-items: center; color: #3F5F5B; font-size: 13px">[عکس ملک]
        <span style="position: absolute; top: 12px; inset-inline-start: 12px; background: #0F766E; color: #FFFFFF; font-size: 12px; font-weight: 700; padding: 2px 10px; border-radius: 999px">فروش</span></div>
      <div style="padding: 12px 14px"><span style="font-size: 12px; color: #4B5B5A">سعادت‌آباد، تهران · ۱۲۰ متر · ۳ خواب</span><strong style="display: block; font-size: 16px">آپارتمان ۱۲۰ متری نوساز</strong><span style="color: #0F766E; font-weight: 800; font-size: 17px">۱۲٫۵ میلیارد تومان</span></div>
    </a>
    <div style="display: flex; gap: 12px; align-items: center; background: #FFFFFF; border: 1px solid #DDE7E5; border-radius: 18px; padding: 10px">
      <span style="width: 88px; height: 72px; border-radius: 12px; background: #DCEBE8; flex: none"></span>
      <div style="min-width: 0"><span style="font-size: 12px; color: #4B5B5A">ونک، تهران · ۶۰ متر</span><strong style="display: block; font-size: 15px">سوئیت مبله نزدیک مترو</strong><span style="color: #0369A1; font-weight: 800; font-size: 14px">رهن ۴۰۰م + اجاره ۸م</span></div>
    </div>
  </div>
  <nav aria-label="منوی اپ" style="height: 72px; background: #FFFFFF; border-top: 1px solid #DDE7E5; display: grid; grid-template-columns: repeat(4, minmax(0, 1fr))">
    <a href="#" aria-current="page" style="display: flex; flex-direction: column; align-items: center; justify-content: center; font-size: 12px; font-weight: 700; color: #0F766E"><svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 10.5 12 3l9 7.5"></path><path d="M5 9.5V21h14V9.5"></path></svg>خانه</a>
    <a href="#" style="display: flex; flex-direction: column; align-items: center; justify-content: center; font-size: 12px; color: #4B5B5A"><svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"></circle><path d="m20 20-3.5-3.5"></path></svg>جست‌وجو</a>
    <a href="AppSaved.dc.html" style="display: flex; flex-direction: column; align-items: center; justify-content: center; font-size: 12px; color: #4B5B5A"><svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 14c1.5-1.5 3-3.2 3-5.5A5.5 5.5 0 0 0 12 5.5 5.5 5.5 0 0 0 2 8.5c0 2.3 1.5 4 3 5.5l7 7Z"></path></svg>نشان‌شده</a>
    <a href="#" style="display: flex; flex-direction: column; align-items: center; justify-content: center; font-size: 12px; color: #4B5B5A"><svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="4"></circle><path d="M4 21a8 8 0 0 1 16 0"></path></svg>پروفایل</a>
  </nav>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(p) { super(p); this.state = { c: 0 }; }
  renderVals() {
    return {
      chips: ['همه', 'خرید', 'اجاره', 'ویلا'].map((label, i) => ({
        label, pick: () => this.setState({ c: i }),
        style: 'min-height: 40px; padding: 0 16px; border-radius: 999px; font: inherit; font-size: 14px; cursor: pointer; ' + (this.state.c === i ? 'background: #0F766E; color: #FFFFFF; border: 1px solid #0F766E; font-weight: 700' : 'background: #FFFFFF; color: #10201F; border: 1px solid #DDE7E5')
      }))
    };
  }
}
</script>
</body>
</html>
