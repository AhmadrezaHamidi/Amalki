# نمونهٔ تولید: فرانت (dist/) و API پشت یک دامنه
server {
    listen 80;
    server_name example.ir;
    root /var/www/amlak/dist;
    index index.html;

    # API و فایل‌های سئو را API می‌سازد
    location /api/ {
        proxy_pass http://127.0.0.1:5300;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        client_max_body_size 6m;   # عکس تا ۵ مگابایت
    }
    location = /sitemap.xml { proxy_pass http://127.0.0.1:5300; }
    location = /robots.txt  { proxy_pass http://127.0.0.1:5300; }
    location = /llms.txt    { proxy_pass http://127.0.0.1:5300; }

    # فایل‌های ساخت Vite نام هش‌دار دارند
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # SPA: هر مسیر دیگر (مثل /املاک یا /ملک/...) همان index.html است
    location / {
        try_files $uri /index.html;
    }
}
