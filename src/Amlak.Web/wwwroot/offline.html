<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8" />

<title>اتصال برقرار نیست | آشیانه</title>
<style>
  body{margin:0;min-height:100vh;display:grid;place-items:center;background:#FAF7F2;color:#1C1917;font-family:'Vazirmatn',system-ui,sans-serif;line-height:1.8;padding:24px;box-sizing:border-box;text-align:center}

  img{width:72px;height:72px;border-radius:18px}
  h1{font-size:1.4rem;margin:8px 0 0}
  p{margin:0;color:#5F5750}
  @media (prefers-color-scheme:dark){body{background:#11151B;color:#ECE7E1}p{color:#A49B91}}
  button{margin-top:8px;min-height:48px;padding:0 28px;border-radius:12px;border:0;background:#C2410C;color:#fff;font:inherit;font-weight:700;cursor:pointer}
</style>
</head>
<body>
<main>
  <img src="/icons/icon-192.png" alt="" width="72" height="72" />
  <h1>به اینترنت وصل نیستید</h1>
  <p>آگهی‌هایی که قبلاً دیده‌اید هنوز در دسترس‌اند. برای دیدن آگهی‌های تازه، اتصال را بررسی کنید.</p>
  <button type="button" onclick="location.reload()">دوباره تلاش کن</button>
</main>
</body>
