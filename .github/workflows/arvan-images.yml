# Images for servers that cannot reach mcr.microsoft.com (ArvanCloud and other hosts in Iran).
# Builds the site image and copies the SQL Server image into this account's GitHub Container Registry:
#   ghcr.io/<owner>/amalki-web:latest      ghcr.io/<owner>/mssql-server:2022-latest
# The packages are private by default: on the server run `docker login ghcr.io` once with a token that has
# read:packages, then IMAGE_REGISTRY=ghcr.io/<owner> sudo -E bash deploy/arvan/install.sh. Guide: docs/DEPLOY-ARVAN.md
name: Arvan images

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: [src/**, Dockerfile, .github/workflows/arvan-images.yml]

permissions:
  contents: read
  packages: write

concurrency: arvan-images

jobs:
  images:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: Build and push the site image
        run: |
          owner=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          image=ghcr.io/$owner/amalki-web
          docker build \
            --label org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }} \
            -t $image:latest -t $image:${{ github.sha }} .
          docker push $image:latest
          docker push $image:${{ github.sha }}

      - name: Copy the SQL Server image
        run: |
          owner=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          docker pull mcr.microsoft.com/mssql/server:2022-latest
          docker tag mcr.microsoft.com/mssql/server:2022-latest ghcr.io/$owner/mssql-server:2022-latest
          docker push ghcr.io/$owner/mssql-server:2022-latest
